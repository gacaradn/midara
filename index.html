<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDARA 💕</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>MIDARA 💕</h1>
            <p>Welcome back, love</p>
            <input type="text" id="username" placeholder="Username (Gachara or Mideva)">
            <input type="password" id="password" placeholder="Password">
            <button onclick="attemptLogin()">Enter Diary</button>
            <p id="login-error" style="color: #ff6b6b; margin-top: 15px; display: none;">Wrong username or password ❤️</p>
        </div>
    </div>

    <div id="main-app" style="display: none;">
        <header>
            <h1>MIDARA</h1>
            <p id="current-date"></p>
            <p id="welcome-user"></p>
        </header>

        <div class="controls">
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>

        <div class="tabs">
            <button onclick="showTab('daily')" id="tab-daily" class="active">Daily To-Do</button>
            <button onclick="showTab('history')" id="tab-history">History</button>
            <button onclick="showTab('earnings')" id="tab-earnings">Earnings</button>
        </div>

        <div id="daily" class="tab-content">
            <div class="columns">
                <div class="column">
                    <h2>Add New Task</h2>
                    <form id="task-form">
                        <input type="text" id="task-name" placeholder="Task Name" required>
                        <select id="task-person">
                            <option value="Gachara">Gachara</option>
                            <option value="Mideva">Mideva</option>
                        </select>
                        <select id="task-type" onchange="toggleAmount(this)">
                            <option value="other">Other</option>
                            <option value="work">Work</option>
                        </select>
                        <input type="number" id="task-amount" placeholder="KSh" style="display:none;">
                        <input type="date" id="task-deadline" required>
                        <button type="button" onclick="addNewTask()">Add Task</button>
                    </form>
                </div>
            </div>
            <h3>Pending Tasks</h3>
            <table id="pending-table">
                <thead><tr><th>Person</th><th>Name</th><th>Deadline</th><th>Overdue</th><th>Done</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="history" class="tab-content" style="display:none;">
            <div id="history-header">
                <h2 id="history-title">Yearly History</h2>
                <button id="history-back-btn" onclick="renderHistoryMonths()" style="display:none;">Back to Months</button>
            </div>
            <div id="history-container" class="grid-container"></div>
        </div>

        <div id="earnings" class="tab-content" style="display:none;">
            <h2>Earnings Analytics 💕</h2>
            <div id="earnings-summary" class="earnings-grid"></div>
            <div class="chart-container" style="position: relative; height:40vh; width:80vw; margin: auto;">
                <canvas id="earningsChart"></canvas>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
